   body {
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: Arial, sans-serif;
        margin: 0;
    }
    .container {
        display: flex;
        width: 100%;
        height: 100vh;
    }
    .sidebar {
        background-color: #000000;
        width: 250px;
        height: 100vh;
        padding: 20px;
        border-right: 1px solid #333;
        flex-shrink: 0;
    }
    .sidebar .title {
        font-size: 1.875rem;
        font-weight: bold;
        margin-bottom: 40px;
        color: #ffffff;
    }
    .sidebar a {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        color: #ffeb3b;
        text-decoration: none;
        font-size: 1.25rem;
        transition: color 0.2s ease;
    }
    .sidebar a i {
        margin-right: 10px;
    }
    .sidebar a:hover {
        color: #ffd600;
    }
    .content {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        background-color: #1a1a1a;
    }
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #333;
    }
    .tabs {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
    }
    .tabs div {
        cursor: pointer;
    }
    .tabs .active {
        color: #ff0;
    }
    .tasks {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }
    .task {
        border: 2px solid #ff0;
        padding: 20px;
        border-radius: 10px;
        margin: 10px;
        position: relative;
        width: 250px;
        height: 250px;
    }
    .task h3 {
        margin-bottom: 10px;
    }
    .task ul {
        list-style: none;
        padding: 0;
    }
    .task ul li {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
    }
    .task ul li input {
        margin-right: 20px;
    }
    .progress-circle {
        position: absolute;
        bottom: 10px;
        right: 10px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid #ff0;
    }
    .progress-circle.completed {
        background-color: #ff0;
    }
    .progress-circle.half-completed {
        background: linear-gradient(to bottom, #ff0 50%, transparent 50%);
    }
    .logout {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #ff0;
    }
  </style>
  <script>
   function updateProgress(taskId) {
        const checkboxes = document.querySelectorAll(`#${taskId} input[type="checkbox"]`);
        const total = checkboxes.length;
        let completed = 0;

        checkboxes.forEach(checkbox => {
            if (checkbox.checked) {
                completed++;
            }
        });

        const progressCircle = document.querySelector(`#${taskId} .progress-circle`);
        if (completed === total) {
            progressCircle.classList.add('completed');
            progressCircle.classList.remove('half-completed');
        } else if (completed > 0) {
            progressCircle.classList.add('half-completed');
            progressCircle.classList.remove('completed');
        } else {
            progressCircle.classList.remove('completed', 'half-completed');
        }
    }
  </script>
 </head>
