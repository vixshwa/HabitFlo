
<html>
<head>
    
    <title>HabitFlo Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
        }
        .sidebar {
            background-color: #000000;
            width: 250px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            padding: 10px 0;
            color: #ffeb3b;
            text-decoration: none;
        }
        .sidebar a i {
            margin-right: 10px;
        }
        .sidebar a:hover, .sidebar ul li:hover span {
            color: #ffd700;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }
        .sidebar ul li i {
            color: #ffeb3b;
            font-size: 18px;
            margin-right: 10px;
        }
        .sidebar ul li.active {
            background-color: #666;
            padding: 10px;
            border-radius: 5px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            box-sizing: border-box;
        }
        .content h2 {
            font-size: 36px;
            margin-bottom: 40px;
        }
        .section {
            border: 1px solid white;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h3 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .section input[type="text"], .section select {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .section button {
            background-color: blue;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .notification-setting {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .notification-setting label {
            font-size: 18px;
            margin-left: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #1a1a1a;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        .modal-content button {
            background-color: blue;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            box-sizing: border-box;
        }
        .content h2 {
            font-size: 36px;
            margin-bottom: 40px;
        }
        .save-all {
            text-align: center;
            margin-top: 20px;
        }
        .save-all button {
            background-color: blue;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <a href="dashboard.html" class="hover:text-yellow-300"><i class="fas fa-home"></i>HabitFlo</a>
            <ul>
                <li onclick="navigateTo('track1.html')"><i class="fas fa-chart-line"></i><span>Track</span></li>
                <li onclick="navigateTo('calendar.html')"><i class="fas fa-calendar-alt"></i><span>Calendar</span></li>
                <li onclick="navigateTo('leaderboard.html')"><i class="fas fa-trophy"></i><span>Leaderboards</span></li>
                <li onclick="navigateTo('friends.html')"><i class="fas fa-user-friends"></i><span>Friends</span></li>
                <li class="active" onclick="navigateTo('settings.html')"><i class="fas fa-cog"></i><span>Settings</span></li>
                <li onclick="navigateTo('logout.html')"><i class="fas fa-sign-out-alt"></i><span>Logout</span></li>
            </ul>
        </div>
        <div class="content">
            <h2>Settings</h2>
            <div class="section">
                <h3>Profile Settings</h3>
                <input type="text" id="username" placeholder="Change username">
                <button onclick="confirmUsernameChange()">Save Changes</button>
            </div>
            <div class="section">
                <h3>Notification Settings</h3>
                <div class="notification-setting">
                    <input type="checkbox" id="emailNotification">
                    <label for="emailNotification">Email Notification</label>
                </div>
                <button>Update Notifications</button>
            </div>
            <div class="section">
                <h3>Privacy Settings</h3>
                <label for="profileVisibility">Profile Visibility</label>
                <select id="profileVisibility">
                    <option>Public</option>
                    <option>Private</option>
                </select>
                <button onclick="savePrivacySettings()">Save Privacy Settings</button>
            </div>
            <div class="save-all">
                <button onclick="saveAllChanges()">Save All Changes</button>
            </div>
        </div>
    </div>

    <div id="usernameModal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to change your username?</p>
            <button onclick="closeModal()">Cancel</button>
            <button onclick="saveUsername()">Confirm</button>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }

        function confirmUsernameChange() {
            document.getElementById('usernameModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('usernameModal').style.display = 'none';
        }

        function saveUsername() {
            // Add logic to save the username
            closeModal();
            alert('Username changed successfully!');
        }

        function savePrivacySettings() {
            // Add logic to save privacy settings
            alert('Privacy settings saved successfully!');
        }

        function saveAllChanges() {
            // Add logic to save all changes
            alert('All changes saved successfully!');
        }
    </script>
</body>
</html>
