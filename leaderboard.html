  <script>
    function searchActivities() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const activityList = document.getElementById('activityList');
      const activities = activityList.getElementsByTagName('div');

      for (let i = 0; i < activities.length; i += 4) {
        const user = activities[i + 1].textContent || activities[i + 1].innerText;
        if (user.toLowerCase().indexOf(filter) > -1) {
          activities[i].style.display = '';
          activities[i + 1].style.display = '';
          activities[i + 2].style.display = '';
          activities[i + 3].style.display = '';
        } else {
          activities[i].style.display = 'none';
          activities[i + 1].style.display = 'none';
          activities[i + 2].style.display = 'none';
          activities[i + 3].style.display = 'none';
        }
      }
    }
  </script>
