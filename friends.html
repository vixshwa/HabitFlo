    .sidebar a {
        display: flex;
        align-items: center;
        padding: 10px;
        color: #ffff00;
        text-decoration: none;
        margin-bottom: 10px;
        font-size: 1.125rem;
    }
    .sidebar a i {
        color: #ffff00;

    }
    .sidebar a:hover {

    }
    .sidebar .active {
        background-color: #4a4a4a;
    }
    .content {
        padding: 20px;
        display: flex;
        flex-direction: column;
        width: calc(100% - 270px);

        .main-content {

        }
        .profile-card, .friend-card {
            border: 1px solid #ffffff; /* White border */
            padding: 10px;
            margin-bottom: 20px;
            width: 60%; /* Shorter width */
            box-sizing: border-box;
        }
        .profile-card img, .friend-card img {
            border-radius: 50%;
        }
        .milestones-card, .requests-card {
            width: 200px; /* Square box */
            height: 200px;
            position: absolute;
            right: 20px;
            border: 1px solid #ffffff; /* White border */
            padding: 10px;
            box-sizing: border-box;
        }
        .milestones-card {
            bottom: 500px; /* Position above requests */
        }
        .requests-card {
            bottom: 280px; /* Position below milestones */
        }
        .milestones-card div, .requests-card div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .milestones-card span {
            color: #ffffff; /* White text color */
        }
        .milestones-card span .number {
            color: #ffff00; /* Yellow number color */
        }
        .requests-card i {
            margin-right: 10px; /* Space between tick and cross */
        }
        .requests-card div {
            color: #ffffff; /* White text color */
        }
        .requests-card .text-xl {

        .user-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;

            border-radius: 50%;
